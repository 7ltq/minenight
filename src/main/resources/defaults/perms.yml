chat:
  enabled: true
  format-with-role: "{role} {name} <white>» {message}"
  format-default: "{name} <white>» {message}"

join:
  enabled: true
  message: "<dark_gray>[<green>+<dark_gray>] <white>{player}"

quit:
  enabled: true
  message: "<dark_gray>[<red>-<dark_gray>] <white>{player}"

groups: {}
players: {}

nametags:
  full-gradients: true
  height-offset: 0.0
