  expired-receiver: '<#B7C7E8>The teleport request from <white>{player} <#B7C7E8>has expired.'
  offline-before-teleport: '<#6685E8>Teleport failed because a player disconnected.'
  teleport-failed: '<#6685E8>Teleportation failed.'
  usage-auto: '<#B7C7E8>Usage: <white>/tpauto'
