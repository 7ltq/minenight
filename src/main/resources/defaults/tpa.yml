settings:
  send-cooldown-seconds: 20
  request-expiry-seconds: 60

messages:
  prefix: '<bold><gradient:#8175AE:#D5DCE8>MineNight</gradient></bold> <dark_gray>» <reset>'
  players-only: '<red>Only players can use this command.'
  usage-tpa: '<gray>Usage: <white>/tpa <player>'
  usage-tpahere: '<gray>Usage: <white>/tpahere <player>'
  usage-accept: '<gray>Usage: <white>/tpaccept [player]'
  usage-decline: '<gray>Usage: <white>/tpadecline [player]'
  not-online: '<red>{player} is not online.'
  self-request: '<red>You cannot send a teleport request to yourself.'
  cooldown: '<red>Please wait <white>{seconds}s <red>before sending another request to <white>{player}<red>.'
  already-pending: '<red>You already have a pending teleport request to <white>{player}<red>.'
  sent: '<gray>Teleport request sent to <white>{player}<gray>.'
  sent-here: '<gray>Asked <white>{player} <gray>to teleport to you.'
  received: '<white>{player} <gray>wants to teleport to you.'
  received-here: '<white>{player} <gray>wants you to teleport to them.'
  accept-button: '<green><bold>[ACCEPT]</bold></green>'
  decline-button: '<red><bold>[DECLINE]</bold></red>'
  no-request: '<red>You have no matching pending teleport requests.'
  declined-receiver: '<gray>Declined the request from <white>{player}<gray>.'
  declined-sender: '<white>{player} <red>declined your teleport request.'
  accepted-sender: '<green>{player} accepted your request.'
  accepted-receiver: '<green>Accepted the teleport request from {player}.'
  expired-sender: '<red>Your teleport request has expired.'
  expired-receiver: '<gray>The teleport request from <white>{player} <gray>has expired.'
  offline-before-teleport: '<red>Teleport failed because a player disconnected.'
  teleport-failed: '<red>Teleportation failed.'
  usage-auto: '<gray>Usage: <white>/tpauto'
  auto-enabled: '<green>Automatic teleport request acceptance enabled.'
  auto-disabled: '<gray>Automatic teleport request acceptance disabled.'
  auto-accepted-sender: '<gray>{player} automatically accepted your teleport request.'
  receiver-disabled-tpa: '<red>{player} is not accepting TPA requests.'
  receiver-disabled-tpahere: '<red>{player} is not accepting TPAHere requests.'
  request-disabled: '<red>You have disabled this type of request in /settings.'
