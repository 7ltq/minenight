  receiver-disabled-tpa: '<#6685E8>{player} is not accepting TPA requests.'
  receiver-disabled-tpahere: '<#6685E8>{player} is not accepting TPAHere requests.'
  request-disabled: '<#6685E8>You have disabled this type of request in /settings.'
