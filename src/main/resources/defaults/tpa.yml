  players-only: '<#6685E8>Only players can use this command.'
  usage-tpa: '<#B7C7E8>Usage: <white>/tpa <player>'
  usage-tpahere: '<#B7C7E8>Usage: <white>/tpahere <player>'
  usage-accept: '<#B7C7E8>Usage: <white>/tpaccept [player]'
  usage-decline: '<#B7C7E8>Usage: <white>/tpadecline [player]'
