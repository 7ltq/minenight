gui:
  title: '<gradient:#8175AE:#D5DCE8>MineNight RTP</gradient>'
  fill-empty-slots: true
  lore:
    - '<gray>World: <white>{world}'
    - '<yellow>Click to teleport instantly'
teleport:
  min-radius: 500
  max-radius: 5000
  max-attempts: 24
  generate-chunks: true
destinations:
  plain:
    enabled: true
    world: plains_world
    display-name: '<green>Plains'
    plain-name: Plains
    icon: GRASS_BLOCK
    slot: 10
  snow:
    enabled: true
    world: snow_world
    display-name: '<aqua>Snow'
    plain-name: Snow
    icon: SNOW_BLOCK
    slot: 11
  desert:
    enabled: true
    world: desert_world
    display-name: '<yellow>Desert'
    plain-name: Desert
    icon: SAND
    slot: 13
  mushroom:
    enabled: true
    world: mushroom_world
    display-name: '<light_purple>Mushroom'
    plain-name: Mushroom
    icon: MYCELIUM
    slot: 15
  badlands:
    enabled: true
    world: badlands_world
    display-name: '<gold>Badlands'
    plain-name: Badlands
    icon: RED_SAND
    slot: 16
  end:
    enabled: true
    world: end_world
    display-name: '<light_purple>The End'
    plain-name: The End
    icon: END_STONE
    slot: 22
messages:
  no-permission: '<gradient:#8175AE:#D5DCE8>MineNight</gradient> <dark_gray>» <red>No permission.'
  player-only: '<red>Only players can use this command.'
  searching: '<gradient:#8175AE:#D5DCE8>MineNight</gradient> <dark_gray>» <gray>Finding a safe location...'
  teleported: '<gradient:#8175AE:#D5DCE8>MineNight</gradient> <dark_gray>» <green>Teleported to {destination}!'
  already-searching: '<gradient:#8175AE:#D5DCE8>MineNight</gradient> <dark_gray>» <yellow>Your RTP is already in progress.'
  destination-disabled: '<red>This destination is disabled.'
  world-not-found: '<red>World {world} is not loaded. Check config.yml.'
  overworld-only: '<red>RTP destinations must be Overworld worlds.'
  no-safe-location: '<red>No safe location was found. Try again.'
  teleport-failed: '<red>Teleport failed. Please try again.'
  rtp-usage: '<red>Usage: /rtp [plains|snow|desert|mushroom|badlands|end] (or /rtpgui)'
  reloaded: '<green>MineNightRTP configuration reloaded.'
