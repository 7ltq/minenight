  preparing: '<#B7C7E8>Opponent found. Preparing arena...'
  matched: '<#B7C7E8>Opponent: <white>{opponent}'
  no-worlds: '<#6685E8>No RTP worlds are currently loaded.'
  no-location: '<#6685E8>No safe 1v1 location was found. Try /rtpq again.'
  no-spawn: '<#6685E8>Practice spawn not configured. Use /prac spawn set here.'
