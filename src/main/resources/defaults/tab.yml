settings:
  update-ticks: 40
  tab-enabled: true
  tab-player-names: true
  minenightperms-prefixes: true
  luckperms-prefixes: true
  luckperms-suffixes: false
  motd-enabled: true
  motd-max-players: -1

tab:
  header:
    - '<bold><gradient:#4B63C4:#91B2FF>MINENIGHT</gradient></bold>'
    - '<#B7C7E8>Crystal PvP <#8298C4>• <white>Practice'
    - ''
    - '<#B7C7E8>Players: <white>{online}<#8298C4>/<white>{max} <#8298C4>• <#B7C7E8>Ping: <white>{ping}ms'
  footer:
    - ''
    - '<#B7C7E8>TPS: <white>{tps} <#8298C4>• <#B7C7E8>minenight.de'
  player-name: '{prefix}{player}{suffix}'

motd:
  lines:
    - '<bold><gradient:#4B63C4:#91B2FF>MINENIGHT</gradient></bold> <#8298C4>• <#B7C7E8>Crystal PvP'
    - '<#B7C7E8>Practice <#8298C4>• <white>{online}/{max} players'

actionbar:
  enabled: true
  interval-ticks: 40
  text: "<gradient:#4B63C4:#91B2FF>minenight.de</gradient>"
