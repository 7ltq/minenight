name: Build MineNightAllInOne

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build standalone core
        run: mvn -B -DskipTests clean package
      - name: Verify no embedded anti-cheat
        run: |
          python3 -c "import zipfile; z=zipfile.ZipFile('target/MineNightAllInOne.jar'); assert not any(n.startswith(('com/deathmotion/totemguard/', 'ac/grim/grimac/', 'de/minenight/totemmonitor/')) or n.endswith('/AntiCheatModule.class') for n in z.namelist()); assert z.testzip() is None"
      - name: Package source ZIP
        run: |
          zip -r MineNightAllInOne-source.zip . \
            -x '.git/*' 'target/*' '.build-tools/*'
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MineNightAllInOne-build
          path: |
            target/MineNightAllInOne.jar
            MineNightAllInOne-source.zip
          if-no-files-found: error
          retention-days: 14
