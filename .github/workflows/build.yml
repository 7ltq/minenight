name: Build MineNightAllInOne

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build plugin
        run: mvn -B -DskipTests package
      - name: Build embedded AntiCheat engine
        run: python3 tools/build_anticheat.py
      - name: Package source ZIP
        run: |
          zip -r MineNightAllInOne-source.zip . \
            -x '.git/*' 'target/*' '.build-tools/*'
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MineNightAllInOne-build
          path: |
            target/MineNightAllInOne.jar
            MineNightAllInOne-source.zip
            target/TotemGuard-corresponding-source.zip
          if-no-files-found: error
          retention-days: 14
