name: Build MineNightAllInOne

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build complete plugin with embedded AntiCheat
        run: mvn -B -DskipTests clean package
      - name: Verify embedded engine
        run: |
          python -c "import zipfile; z=zipfile.ZipFile('target/MineNightAllInOne.jar'); assert 'com/deathmotion/totemguard/paper/TGPaperPlatform.class' in z.namelist(); assert 'META-INF/totemguard/integrity.sha256' in z.namelist(); assert z.testzip() is None"
      - name: Package source ZIP
        run: |
          zip -r MineNightAllInOne-source.zip . \
            -x '.git/*' 'target/*' '.build-tools/*'
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MineNightAllInOne-build
          path: |
            target/MineNightAllInOne.jar
            MineNightAllInOne-source.zip
            target/TotemGuard-corresponding-source.zip
          if-no-files-found: error
          retention-days: 14
